kind = "mobile"
previewPath = "/enable-scotland/"
title = "Enable Scotland"
description = "An offline-first journey companion that helps people travel with more confidence through clear steps, supportive checklists, emergency contacts and SOS messaging."
version = "1.0.0"
id = "artifacts/enable-scotland"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/enable-scotland/" ]
localPort = 18934

[services.development]
run = "pnpm --filter @workspace/enable-scotland run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/enable-scotland", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/enable-scotland", "run", "serve" ]

[services.env]
PORT = "18934"
BASE_PATH = "/enable-scotland/"
